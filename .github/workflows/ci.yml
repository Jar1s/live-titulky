name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps (bez MLX — unit testy čistej logiky)
        run: pip install numpy scipy pytest ruff
      - name: Lint
        run: ruff check titulky/ test_units.py --ignore E501,SIM115,SIM102
      - name: Unit testy
        run: pytest test_units.py -v
