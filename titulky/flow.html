<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<title>titulky — flow debug</title>
<style>
  body{margin:0;background:#0d1117;color:#e6edf3;font:13px/1.45 ui-monospace,Menlo,monospace}
  header{display:flex;gap:18px;padding:8px 14px;background:#161b22;border-bottom:1px solid #30363d;
         position:sticky;top:0;align-items:center;flex-wrap:wrap}
  header b{color:#58a6ff}
  .m{color:#8b949e}.m b{color:#e6edf3}
  #cols{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#30363d;min-height:calc(100vh - 42px)}
  .col{background:#0d1117;padding:10px;overflow-y:auto;max-height:calc(100vh - 42px)}
  .col h2{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#8b949e;
          border-bottom:1px solid #21262d;padding-bottom:6px}
  .ev{padding:4px 6px;margin:2px 0;border-radius:4px;background:#161b22;border-left:3px solid #30363d;
      word-break:break-word;animation:in .3s}
  @keyframes in{from{opacity:0;transform:translateY(-3px)}to{opacity:1}}
  .ev .ts{color:#8b949e;font-size:11px;margin-right:6px}
  .ev.audio{border-left-color:#3fb950}.ev.vad{border-left-color:#d29922;color:#d29922}
  .ev.draft{border-left-color:#8b949e}
  .ev.final{border-left-color:#58a6ff}
  .ev.korekcia{border-left-color:#bc8cff;color:#bc8cff}
  .ev.corr{border-left-color:#f85149;background:#2d1517;font-weight:600}
  #vu{width:120px;height:10px;background:#21262d;border-radius:5px;overflow:hidden}
  #vu i{display:block;height:100%;width:0;background:#3fb950;transition:width .3s}
  #vu.low i{background:#f85149}
  .lat{color:#3fb950}.lat.slow{color:#f85149}
</style>
</head>
<body>
<header>
  <b>FLOW</b>
  <span class="m">audio <span id="vu"><i></i></span> rms <b id="rms">—</b> / prah <b id="thr">—</b></span>
  <span class="m">draft lat <b id="dlat">—</b></span>
  <span class="m">final lat <b id="flat">—</b></span>
  <span class="m">RTF <b id="rtf">—</b></span>
  <span class="m">flicker <b id="flick">—</b></span>
  <span class="m">korekcie <b id="ncorr">0</b></span>
  <span class="m" id="wsstat">⏳ pripájam…</span>
  <a href="/" style="color:#58a6ff;text-decoration:none;margin-left:auto">◱ overlay</a>
</header>
<div id="cols">
  <div class="col"><h2>1 · Audio / VAD</h2><div id="c-audio"></div></div>
  <div class="col"><h2>2 · Draft (small, ~1.5 s)</h2><div id="c-draft"></div></div>
  <div class="col"><h2>3 · Final (turbo, commit)</h2><div id="c-final"></div></div>
  <div class="col"><h2>4 · Korekcia (Azure+gaty)</h2><div id="c-corr"></div></div>
</div>
<script>
const $ = id => document.getElementById(id);
let ncorr = 0;
function row(col, cls, html){
  const d = document.createElement('div');
  d.className = 'ev ' + cls;
  d.innerHTML = '<span class="ts">' + new Date().toLocaleTimeString('sk',{hour12:false}) + '</span>' + html;
  const c = $(col); c.prepend(d);
  while (c.children.length > 120) c.removeChild(c.lastChild);
}
const esc = s => (s??'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;');
const ws = new WebSocket('ws://' + location.host + '/ws');
ws.onopen = () => $('wsstat').textContent = '🟢 live';
ws.onclose = () => $('wsstat').textContent = '🔴 odpojené';
let lastVad = 0, lastAudioRow = 0;
ws.onmessage = e => {
  const d = JSON.parse(e.data);
  if (d.event){
    const v = d.event;
    if (v.t === 'audio'){
      $('rms').textContent = v.rms.toFixed(3);
      $('thr').textContent = v.thr.toFixed(3);
      const vu = $('vu');
      vu.firstElementChild.style.width = Math.min(100, v.rms*400) + '%';
      vu.className = v.rms < v.thr ? 'low' : '';
      if (Date.now() - lastAudioRow > 5000){ lastAudioRow = Date.now();
        row('c-audio','audio','rms ' + v.rms.toFixed(3) + (v.rms < v.thr ? ' <b style="color:#f85149">pod prahom</b>' : ' ✓ reč')); }
    } else if (v.t === 'vad'){
      if (Date.now() - lastVad > 1500){ lastVad = Date.now(); row('c-audio','vad','✂ ' + esc(v.msg)); }
    } else if (v.t === 'draft'){
      row('c-draft','draft', esc(v.text) + ' <span class="m">(' + v.dur + 's dekód)</span>');
    } else if (v.t === 'final'){
      const lat = v.lat ? '<span class="lat' + (v.lat > 6 ? ' slow' : '') + '"> ' + v.lat + 's</span>' : '';
      row('c-final','final','✔ ' + esc(v.words) + lat + ' <span class="m">' + esc(v.corr) + '</span>');
    } else if (v.t === 'korekcia'){
      row('c-corr','korekcia', esc(v.msg.replace('[korekcia] ','')));
    } else if (v.t === 'corr'){
      ncorr++; $('ncorr').textContent = ncorr;
      row('c-corr','corr','✏ ' + esc(v.from) + ' → ' + esc(v.to));
      row('c-final','corr','✏ oprava: ' + esc(v.from) + ' → ' + esc(v.to));
    }
    return;
  }
  if ('committed' in d){
    if (d.draft_latency_s)  $('dlat').textContent  = d.avg_draft_latency_s.toFixed(1) + 's';
    if (d.final_latency_s)  $('flat').textContent  = d.avg_final_latency_s.toFixed(1) + 's';
    if (d.rtf != null)      $('rtf').textContent   = d.rtf;
    if (d.flicker_rate != null) $('flick').textContent = (d.flicker_rate*100).toFixed(0) + '%';
  }
};
</script>
</body>
</html>
