<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TITULKY.ŽIVO — Záznamy</title>
<style>
:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Segoe UI", system-ui, sans-serif;
  --font-d: -apple-system, BlinkMacSystemFont, "SF Pro Display", Inter, system-ui, sans-serif;
  --bg: #202227;
  --card: linear-gradient(180deg, #2b2e34 0%, #24262b 100%);
  --card-in: #1d1f24;
  --line: rgba(255,255,255,.065);
  --hi: rgba(255,255,255,.09);
  --ink: #f5f5f7; --ink2: #a6adb8; --ink3: #6b7280;
  --blue: #2f7cf6; --blue2: #58a0ff; --green: #22a559; --danger: #d92d3a;
  --r-xl: 30px; --r-lg: 24px;
  --shadow: 0 18px 44px rgba(0,0,0,.38), 0 2px 8px rgba(0,0,0,.25);
  --ease: cubic-bezier(.22,.8,.24,1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink);
  font: 15px/1.55 var(--font); -webkit-font-smoothing: antialiased; }

#side {
  position: fixed; top: 14px; left: 14px; bottom: 14px; width: 232px;
  background: var(--card); border: 1px solid var(--line);
  border-radius: var(--r-xl);
  box-shadow: var(--shadow), inset 0 1px 0 var(--hi);
  padding: 20px 14px; display: flex; flex-direction: column; gap: 4px;
}
#brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; }
#logo { width: 36px; height: 36px; border-radius: 11px;
  background: linear-gradient(135deg, var(--blue2), var(--blue));
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; box-shadow: 0 6px 16px rgba(47,124,246,.4); }
#brand b { font-family: var(--font-d); font-size: 17px; }
.nav { display: flex; align-items: center; gap: 11px; padding: 10px 12px;
  border-radius: 14px; color: var(--ink2); text-decoration: none;
  font-size: 14px; font-weight: 500; transition: background .2s var(--ease); }
.nav:hover { background: rgba(255,255,255,.05); color: var(--ink); }
.nav.on { background: linear-gradient(180deg, #3a3e45, #2e3137);
  color: var(--ink); box-shadow: inset 0 1px 0 var(--hi),
  0 4px 12px rgba(0,0,0,.25); }
.nav .ic { width: 20px; text-align: center; opacity: .85; }
#side .foot { margin-top: auto; padding: 10px 12px; font-size: 11.5px;
  color: var(--ink3); }

main { margin-left: 278px; padding: 44px 40px 90px; max-width: 980px; }
h1 { font-family: var(--font-d); font-size: clamp(30px, 2vw + 14px, 42px);
  font-weight: 800; letter-spacing: -.02em; margin-bottom: 8px; }
.sub { color: var(--ink2); margin-bottom: 28px; font-size: 14px; }
code { background: var(--card-in); border: 1px solid var(--line);
  border-radius: 6px; padding: 1px 6px; font-size: 12px; }

.sess { background: var(--card); border: 1px solid var(--line);
  border-radius: var(--r-lg); padding: 18px 22px; margin-bottom: 14px;
  box-shadow: var(--shadow), inset 0 1px 0 var(--hi); cursor: pointer;
  transition: transform .15s var(--ease), border-color .15s; }
.sess:hover { transform: translateY(-1px); border-color: rgba(47,124,246,.35); }
.sess .head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.sess .when { font-family: var(--font-d); font-size: 16px; font-weight: 700; }
.badge { font-size: 10.5px; font-weight: 700; letter-spacing: .06em;
  padding: 3px 10px; border-radius: 20px; text-transform: uppercase; }
.b-local { background: rgba(34,165,89,.16); color: #4ade80; }
.b-cloud { background: rgba(47,124,246,.16); color: #7ab2ff; }
.sess .head .sp { flex: 1; }
.metr { display: flex; gap: 20px; font-size: 12.5px; color: var(--ink2);
  font-variant-numeric: tabular-nums; }
.metr b { color: var(--ink); font-weight: 650; }
.sess .prev { color: var(--ink3); font-size: 13px; margin-top: 8px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.sess .detail { display: none; margin-top: 14px; }
.sess.open .detail { display: block; }
.sess.open { cursor: default; }
.transcript { background: var(--card-in); border: 1px solid var(--line);
  border-radius: 16px; padding: 14px 16px; font-size: 14px; line-height: 1.7;
  color: var(--ink); max-height: 320px; overflow-y: auto;
  box-shadow: inset 0 1px 3px rgba(0,0,0,.25); }
.dbtns { display: flex; gap: 10px; margin-top: 12px; }
.dbtns button { background: linear-gradient(180deg, #33363d, #2a2d33);
  color: var(--ink); border: 1px solid var(--line); border-radius: 999px;
  padding: 8px 18px; font: 500 12.5px var(--font); cursor: pointer;
  box-shadow: inset 0 1px 0 var(--hi); }
.dbtns button:hover { border-color: var(--blue); }
.dbtns button.del:hover { border-color: var(--danger); color: #f87171; }
#empty { text-align: center; color: var(--ink3); padding: 70px 0;
  font-size: 14.5px; }
#empty .big { font-size: 40px; display: block; margin-bottom: 12px; }
@media (max-width: 860px) { #side { display: none; }
  main { margin-left: 0; padding: 26px 18px 70px; } }
</style>
</head>
<body>

<aside id="side">
  <div id="brand"><div id="logo">🎙</div><b>TITULKY.ŽIVO</b></div>
  <a class="nav" href="/"><span class="ic">▣</span>Overlay</a>
  <a class="nav" href="/studio"><span class="ic">🎛</span>Studio</a>
  <a class="nav" href="/flow"><span class="ic">⚡</span>Flow</a>
  <a class="nav" href="/lab"><span class="ic">◉</span>Lab</a>
  <a class="nav on" href="/sessions"><span class="ic">▤</span>Záznamy</a>
  <a class="nav" href="/settings"><span class="ic">⚙</span>Nastavenia</a>
  <div class="foot">~/.config/titulky/sessions/<br>autosave každých 30 s</div>
</aside>

<main>
<h1>Záznamy</h1>
<p class="sub">Každá session sa ukladá automaticky — prepis aj metriky. Klikni na
záznam pre celý prepis a export.</p>
<div id="list"></div>
</main>

<script src="/hotkeys.js"></script>
<script>
const $ = s => document.querySelector(s);

function fmtDur(s) {
  const m = Math.floor(s / 60), ss = Math.round(s % 60);
  return m ? `${m} min ${ss} s` : `${ss} s`;
}
function esc(t) { const d = document.createElement("div");
  d.textContent = t; return d.innerHTML; }

async function load() {
  if (document.querySelector(".sess.open")) return;  // necitaj pod rukami
  const list = await (await fetch("/api/sessions")).json();
  const box = $("#list"); box.innerHTML = "";
  if (!list.length) {
    box.innerHTML = `<div id="empty"><span class="big">▤</span>
      Zatiaľ žiadne záznamy.<br>Povedz niečo do mikrofónu — session sa uloží sama.</div>`;
    return;
  }
  for (const s of list) {
    const el = document.createElement("div");
    el.className = "sess"; el.dataset.id = s.id;
    const eng = s.engine === "cloud"
      ? `<span class="badge b-cloud">cloud · ${esc(s.model || "")}</span>`
      : `<span class="badge b-local">lokál</span>`;
    el.innerHTML = `
      <div class="head">
        <span class="when">${esc(s.started || s.id)}</span>${eng}
        <span class="sp"></span>
        <span class="metr">
          <span><b>${fmtDur(s.duration_s || 0)}</b></span>
          <span><b>${s.words}</b> slov</span>
          <span>šedé <b>${s.draft_p50_s ?? "—"}${s.draft_p50_s ? " s" : ""}</b></span>
          <span>biele <b>${s.final_p50_s ?? "—"}${s.final_p50_s ? " s" : ""}</b></span>
        </span>
      </div>
      <div class="prev">${esc(s.preview || "")}</div>
      <div class="detail"></div>`;
    el.onclick = () => { if (!el.classList.contains("open")) openDetail(el, s.id); };
    box.appendChild(el);
  }
}

async function openDetail(el, id) {
  document.querySelectorAll(".sess.open").forEach(x => {
    x.classList.remove("open"); x.querySelector(".detail").innerHTML = ""; });
  const d = await (await fetch("/api/sessions?id=" + encodeURIComponent(id))).json();
  const det = el.querySelector(".detail");
  det.innerHTML = `
    <div class="transcript">${esc(d.transcript || "")}</div>
    <div class="dbtns">
      <button class="txt">⬇ TXT</button>
      <button class="cp">⧉ Kopírovať</button>
      <button class="del">✕ Zmazať</button>
      <button class="cls">Zavrieť</button>
    </div>`;
  det.querySelector(".txt").onclick = ev => { ev.stopPropagation();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([d.transcript], {type: "text/plain"}));
    a.download = `prepis-${id}.txt`; a.click(); };
  det.querySelector(".cp").onclick = async ev => { ev.stopPropagation();
    await navigator.clipboard.writeText(d.transcript);
    ev.target.textContent = "✓ Skopírované";
    setTimeout(() => ev.target.textContent = "⧉ Kopírovať", 1600); };
  det.querySelector(".del").onclick = async ev => { ev.stopPropagation();
    if (!confirm("Zmazať tento záznam?")) return;
    await fetch(`/api/sessions?id=${encodeURIComponent(id)}&del=1`);
    load(); };
  det.querySelector(".cls").onclick = ev => { ev.stopPropagation();
    el.classList.remove("open"); det.innerHTML = ""; };
  el.classList.add("open");
}

HK.add("r", "Obnoviť zoznam", load);
load();
setInterval(load, 60000);   // live session sa priebežne dopĺňa
</script>
</body>
</html>
