<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Titulky — živý prepis</title>
<style>
/* ── Reset & tokens ────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #202227;
  --card: linear-gradient(180deg, #2b2e34 0%, #24262b 100%);
  --surface: rgba(255,255,255,.055);
  --surface-strong: rgba(255,255,255,.10);
  --border: rgba(255,255,255,.075);
  --hi: rgba(255,255,255,.09);
  --shadow: 0 18px 44px rgba(0,0,0,.38), 0 2px 8px rgba(0,0,0,.25);
  --ink: #f5f5f7;
  --ink-2: rgba(245,245,247,.55);
  --ink-3: rgba(245,245,247,.28);
  --live: #30d158;
  --acc: #2f7cf6;
  --warn: #ff9f0a;
  --blur: blur(24px) saturate(160%);
  --font-size: 44px;
  --line-width: 28ch;
  --caption-font: -apple-system, "SF Pro Display", system-ui, sans-serif;
}
body.theme-chroma { background: #00ff00 !important; --bg:#00ff00; --surface:rgba(0,0,0,.80); --surface-strong:rgba(0,0,0,.90); --border:rgba(0,0,0,.2); --ink:#fff; --ink-2:rgba(255,255,255,.55); --ink-3:rgba(255,255,255,.3); }
body.theme-light { --bg:#f4f4f5; --surface:rgba(0,0,0,.05); --surface-strong:rgba(0,0,0,.09); --border:rgba(0,0,0,.10); --ink:#18181b; --ink-2:rgba(24,24,27,.5); --ink-3:rgba(24,24,27,.28); }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, "SF Pro Text", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  height: 100vh;
  overflow: hidden;
  transition: background .3s;
}

/* ── Top chrome: jedna tenká lišta cez celú šírku ──────────────── */
#topbar {
  position: fixed; top: 14px; left: 14px; right: 14px;
  height: 54px;
  display: flex; align-items: center;
  padding: 0 18px;
  gap: 16px;
  z-index: 100;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  box-shadow: var(--shadow), inset 0 1px 0 var(--hi);
  transition: opacity .4s, transform .4s;
}
body.theme-chroma #topbar { background: var(--surface-strong);
  backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); }
body.theme-light #topbar { background: linear-gradient(180deg, #ffffff, #f2f2f4);
  box-shadow: 0 10px 30px rgba(0,0,0,.10), inset 0 1px 0 #fff; }
#topbar.hidden { opacity: 0; transform: translateY(-6px); pointer-events: none; }
#topbar > * { position: relative; }

/* Wordmark + live eq */
#brand { display: flex; align-items: center; gap: 10px; min-width: 150px; }
#wordmark {
  font: 700 13px/1 var(--caption-font);
  letter-spacing: .14em;
  color: var(--ink);
}
#wordmark span { color: var(--ink-3); font-weight: 500; }
#eq { display: flex; align-items: flex-end; gap: 2px; height: 12px; }
#eq i {
  width: 3px; border-radius: 1px;
  background: var(--ink-3);
  height: 3px;
  transition: background .3s;
}
#eq.live i { background: var(--live); animation: eq .9s ease-in-out infinite; }
#eq.live i:nth-child(1) { animation-delay: 0s; }
#eq.live i:nth-child(2) { animation-delay: .25s; }
#eq.live i:nth-child(3) { animation-delay: .5s; }
@keyframes eq { 0%,100% { height: 3px; } 50% { height: 12px; } }

#topbar-center { flex: 1; display: flex; justify-content: center; }

/* Segmented control */
#mode-control {
  display: flex;
  background: rgba(0,0,0,.22);
  border: 1px solid var(--border);
  border-radius: 999px;
  box-shadow: inset 0 1px 3px rgba(0,0,0,.25);
  padding: 3px;
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  gap: 2px;
}
.seg-btn {
  background: none; border: none;
  color: var(--ink-2);
  font: 600 11.5px/1 var(--caption-font);
  letter-spacing: .06em;
  text-transform: uppercase;
  padding: 7px 16px;
  border-radius: 999px;
  cursor: pointer;
  transition: background .15s, color .15s;
  white-space: nowrap;
}
.seg-btn.active { background: linear-gradient(180deg, #58a0ff, var(--acc));
  color: #fff; box-shadow: 0 4px 12px rgba(47,124,246,.4); }
body.theme-light .seg-btn.active { color: #fff; }
.seg-btn:hover:not(.active) { color: var(--ink); }
#mic-btn.paused { color: #ff6b6b; }

/* Pravá strana: tichá mono telemetria + akcie */
#right { display: flex; align-items: center; gap: 14px; min-width: 150px; justify-content: flex-end; }
#stats {
  font: 500 11px/1.4 ui-monospace, "SF Mono", monospace;
  color: var(--ink-3);
  text-align: right;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
#stats b { color: var(--ink-2); font-weight: 500; }
#stats .warn { color: var(--warn); }
#conn { color: var(--warn); }
#conn.off { color: #ff453a; }
.iconbtn {
  background: none; border: none;
  color: var(--ink-3);
  width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  font-size: 14px;
  border-radius: 999px;
  transition: color .15s, background .15s;
  text-decoration: none;
}
.iconbtn:hover { color: var(--ink); background: var(--surface); }

/* ── Settings panel ────────────────────────────────────────────── */
#settings-panel {
  position: fixed; top: 78px; right: 14px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 18px;
  width: 244px;
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  box-shadow: var(--shadow), inset 0 1px 0 var(--hi);
  z-index: 200;
  display: none; flex-direction: column; gap: 14px;
  opacity: 0; transform: translateY(-6px) scale(.97);
  transition: opacity .18s, transform .18s;
}
#settings-panel.open { display: flex; opacity: 1; transform: none; }
.setting-group { display: flex; flex-direction: column; gap: 6px; }
.setting-label {
  font: 600 10px/1 var(--caption-font);
  letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-3);
}
.seg-row {
  display: flex;
  background: rgba(0,0,0,.25);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 2px; gap: 2px;
}
body.theme-light .seg-row { background: rgba(0,0,0,.06); }
.seg-opt {
  flex: 1; background: none; border: none;
  color: var(--ink-2);
  font: 600 11px/1 var(--caption-font);
  padding: 6px 4px; border-radius: 6px;
  cursor: pointer; text-align: center;
  transition: background .12s, color .12s;
}
.seg-opt.active { background: linear-gradient(180deg, #4a4e56, #383b42);
  color: var(--ink); box-shadow: inset 0 1px 0 var(--hi); }
.settings-divider { border: none; border-top: 1px solid var(--border); }

/* ── Idle stav: nie prázdna obrazovka ──────────────────────────── */
#idle {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 18px;
  z-index: 10;
  opacity: 0; pointer-events: none;
  transition: opacity .8s ease;
}
#idle.show { opacity: 1; }
#idle-dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--live);
  box-shadow: 0 0 0 0 rgba(48,209,88,.45);
  animation: breathe 2.6s ease-out infinite;
}
@keyframes breathe {
  0% { box-shadow: 0 0 0 0 rgba(48,209,88,.45); }
  70% { box-shadow: 0 0 0 18px rgba(48,209,88,0); }
  100% { box-shadow: 0 0 0 0 rgba(48,209,88,0); }
}
#idle-title { font: 600 17px/1.3 var(--caption-font); letter-spacing: -.01em; color: var(--ink-2); }
#idle-sub { font: 400 13px/1.5 var(--caption-font); color: var(--ink-3); text-align: center; }
#idle-sub kbd {
  font: 500 11px ui-monospace, "SF Mono", monospace;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 4px; padding: 1px 5px;
}
#idle.waiting #idle-dot { background: var(--warn); animation: none; box-shadow: none; }
@media (prefers-reduced-motion: reduce) { #idle-dot, #eq.live i { animation: none; } }

/* ── Scrim pod titulkami (dark theme, pozícia dole) ────────────── */
#scrim {
  position: fixed; left: 0; right: 0; bottom: 0;
  height: 32vh;
  background: linear-gradient(to top, rgba(0,0,0,.72), rgba(0,0,0,.35) 55%, transparent);
  z-index: 40;
  opacity: 0; pointer-events: none;
  transition: opacity .6s;
}
body:not(.theme-chroma):not(.theme-light) #scrim.show { opacity: 1; }

/* ── Caption stage ─────────────────────────────────────────────── */
#caption-wrap {
  position: fixed; left: 0; right: 0;
  display: flex; justify-content: center;
  z-index: 50;
  transition: opacity .5s;
}
#caption-wrap.pos-bottom { bottom: 6vh; top: auto; align-items: flex-end; }
#caption-wrap.pos-center { top: 50%; transform: translateY(-50%); bottom: auto; }
#caption-wrap.pos-top    { top: 80px; bottom: auto; align-items: flex-start; }
#caption-wrap.hidden { opacity: 0; pointer-events: none; }

#caption-glass {
  font-size: var(--font-size); /* ch v max-width musí škálovať s titulkami */
  padding: 16px 28px 18px;
  max-width: min(var(--line-width), 92vw);
  width: max-content;
  border-radius: 16px;
}
/* glass panel len tam, kde text nemá scrim: chroma + light + ne-bottom */
body.theme-chroma #caption-glass,
body.theme-light #caption-glass {
  background: var(--surface-strong);
  border: 1px solid var(--border);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  box-shadow: 0 8px 40px rgba(0,0,0,.35);
}
body.theme-chroma #caption-glass { background: rgba(0,0,0,.84); }

/* ── Typografia titulkov ───────────────────────────────────────── */
#subs, #roll {
  font-family: var(--caption-font);
  font-size: var(--font-size);
  font-weight: 640;
  line-height: 1.26;
  letter-spacing: -.015em;
  text-align: left;
  text-shadow: 0 2px 14px rgba(0,0,0,.65), 0 1px 3px rgba(0,0,0,.5);
  display: none;
}
body.theme-light #subs, body.theme-light #roll { text-shadow: none; }

#committed { color: var(--ink); }
#pending { color: var(--ink-2); }
#cursor, #rcursor {
  color: var(--live);
  display: none;
  animation: blink .85s steps(2) infinite;
  font-weight: 400;
}
@keyframes blink { 50% { opacity: 0; } }

#roll .line { min-height: 1.26em; white-space: nowrap; overflow: hidden; }
#roll .line.top { color: var(--ink-2); }
#roll .line.bot { color: var(--ink); }
#l2p { color: var(--ink-2); }

.w { display: inline; animation: w-in .16s ease-out both; }
@keyframes w-in { from { opacity: 0; transform: translateY(3px); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }
@media (prefers-reduced-motion: reduce) { .w { animation: none; } }
</style>
</head>
<body>

<!-- Top chrome -->
<div id="topbar">
  <div id="brand">
    <span id="wordmark">TITULKY<span>&hairsp;.ŽIVO</span></span>
    <div id="eq"><i></i><i></i><i></i></div>
  </div>
  <div id="topbar-center">
    <div id="mode-control" role="group" aria-label="Režim">
      <button class="seg-btn" id="btn-titulky" title="Klávesa M">Titulky</button>
      <button class="seg-btn" id="btn-diktovanie" title="Klávesa M">Diktovanie</button>
    </div>
  </div>
  <div id="right">
    <span id="stats"><span id="conn">čakám na server…</span></span>
    <button class="iconbtn" id="mic-btn" title="Mikrofón zap/vyp (K)">⏸</button>
    <a href="/studio" class="iconbtn" title="Studio — kamera, modely, štatistiky">🎛</a>
    <a href="/flow" class="iconbtn" title="Flow debug">⚡</a>
    <button class="iconbtn" id="settings-btn" title="Nastavenia">⚙</button>
  </div>
</div>

<!-- Settings panel -->
<div id="settings-panel" role="dialog" aria-label="Nastavenia titulkov">
  <div class="setting-group">
    <span class="setting-label">Veľkosť písma</span>
    <div class="seg-row" id="size-row">
      <button class="seg-opt" data-size="S">S</button>
      <button class="seg-opt" data-size="M">M</button>
      <button class="seg-opt" data-size="L">L</button>
      <button class="seg-opt" data-size="XL">XL</button>
    </div>
  </div>
  <hr class="settings-divider">
  <div class="setting-group">
    <span class="setting-label">Pozícia</span>
    <div class="seg-row" id="pos-row">
      <button class="seg-opt" data-pos="bottom">Dole</button>
      <button class="seg-opt" data-pos="center">Stred</button>
      <button class="seg-opt" data-pos="top">Hore</button>
    </div>
  </div>
  <hr class="settings-divider">
  <div class="setting-group">
    <span class="setting-label">Téma</span>
    <div class="seg-row" id="theme-row">
      <button class="seg-opt" data-theme="dark">Tmavá</button>
      <button class="seg-opt" data-theme="chroma">Chroma</button>
      <button class="seg-opt" data-theme="light">Svetlá</button>
    </div>
  </div>
  <hr class="settings-divider">
  <div class="setting-group">
    <span class="setting-label">Šírka riadku</span>
    <div class="seg-row" id="width-row">
      <button class="seg-opt" data-width="narrow">Úzka</button>
      <button class="seg-opt" data-width="medium">Stred</button>
      <button class="seg-opt" data-width="wide">Široká</button>
    </div>
  </div>
</div>

<!-- Idle stav -->
<div id="idle">
  <div id="idle-dot"></div>
  <div id="idle-title">Počúvam</div>
  <div id="idle-sub">Začni hovoriť — prepis sa objaví okamžite.<br>Režim prepneš klávesou <kbd>M</kbd></div>
</div>

<!-- Scrim -->
<div id="scrim"></div>

<!-- Caption area -->
<div id="caption-wrap" class="pos-bottom hidden">
  <div id="caption-glass">
    <!-- DIKTOVANIE -->
    <div id="subs">
      <span id="committed"></span><span id="pending"></span><span id="cursor">▍</span>
    </div>
    <!-- TITULKY -->
    <div id="roll">
      <div class="line top" id="l1"></div>
      <div class="line bot" id="l2">
        <span id="l2t"></span><span id="l2p"></span>
        <span id="rcursor" style="display:none;animation:blink .85s steps(2) infinite">▍</span>
      </div>
    </div>
  </div>
</div>

<script>
/* ── Settings ──────────────────────────────────────────────────── */
const SIZES   = { S:'30px', M:'38px', L:'46px', XL:'58px' };
const WIDTHS  = { narrow:'20ch', medium:'28ch', wide:'38ch' };
const LS_PRE  = 'titulky_';

function ls(k, def) { return localStorage.getItem(LS_PRE+k) ?? def; }
function lsSet(k, v) { localStorage.setItem(LS_PRE+k, v); }

let cfg = {
  mode:  ls('mode',  'titulky'),
  size:  ls('size',  'L'),
  pos:   ls('pos',   'bottom'),
  theme: ls('theme', 'dark'),
  width: ls('width', 'medium'),
};

function applyCfg() {
  document.documentElement.style.setProperty('--font-size', SIZES[cfg.size] || SIZES.L);
  document.documentElement.style.setProperty('--line-width', WIDTHS[cfg.width] || WIDTHS.medium);
  captionWrap.className = `pos-${cfg.pos}`;
  if (captionHidden) captionWrap.classList.add('hidden');
  document.body.className = document.body.className.replace(/theme-\S+/g, '').trim();
  if (cfg.theme !== 'dark') document.body.classList.add(`theme-${cfg.theme}`);

  subsEl.style.display = cfg.mode === 'diktovanie' ? 'block' : 'none';
  rollEl.style.display = cfg.mode === 'titulky'    ? 'block' : 'none';
  document.getElementById('btn-titulky').classList.toggle('active', cfg.mode === 'titulky');
  document.getElementById('btn-diktovanie').classList.toggle('active', cfg.mode === 'diktovanie');

  document.querySelectorAll('[data-size]').forEach(b => b.classList.toggle('active', b.dataset.size === cfg.size));
  document.querySelectorAll('[data-pos]').forEach(b  => b.classList.toggle('active', b.dataset.pos  === cfg.pos));
  document.querySelectorAll('[data-theme]').forEach(b=> b.classList.toggle('active', b.dataset.theme=== cfg.theme));
  document.querySelectorAll('[data-width]').forEach(b=> b.classList.toggle('active', b.dataset.width=== cfg.width));
  updateEmptyState();
}

/* ── DOM refs ──────────────────────────────────────────────────── */
const subsEl      = document.getElementById('subs');
const rollEl      = document.getElementById('roll');
const captionWrap = document.getElementById('caption-wrap');
const committed   = document.getElementById('committed');
const pending     = document.getElementById('pending');
const cursor      = document.getElementById('cursor');
const l1          = document.getElementById('l1');
const l2t         = document.getElementById('l2t');
const l2p         = document.getElementById('l2p');
const rcursor     = document.getElementById('rcursor');
const statsEl     = document.getElementById('stats');
const topbar      = document.getElementById('topbar');
const settingsBtn = document.getElementById('settings-btn');
const settingsPanel = document.getElementById('settings-panel');
const idleEl      = document.getElementById('idle');
const scrimEl     = document.getElementById('scrim');
const eqEl        = document.getElementById('eq');

/* ── Auto-hide topbar ──────────────────────────────────────────── */
let topbarTimer = null;
function showTopbar() {
  topbar.classList.remove('hidden');
  clearTimeout(topbarTimer);
  topbarTimer = setTimeout(() => topbar.classList.add('hidden'), 4000);
}
document.addEventListener('mousemove', showTopbar);
document.addEventListener('touchstart', showTopbar);
showTopbar();

/* ── Settings panel ────────────────────────────────────────────── */
settingsBtn.addEventListener('click', e => {
  e.stopPropagation();
  const open = settingsPanel.classList.toggle('open');
  if (open) {
    settingsPanel.style.display = 'flex';
    requestAnimationFrame(() => settingsPanel.classList.add('open'));
  }
});
document.addEventListener('click', () => {
  settingsPanel.classList.remove('open');
  setTimeout(() => { if (!settingsPanel.classList.contains('open')) settingsPanel.style.display = 'none'; }, 200);
});
settingsPanel.addEventListener('click', e => e.stopPropagation());

document.querySelectorAll('[data-size]').forEach(b => b.addEventListener('click', () => {
  cfg.size = b.dataset.size; lsSet('size', cfg.size); applyCfg();
}));
document.querySelectorAll('[data-pos]').forEach(b => b.addEventListener('click', () => {
  cfg.pos = b.dataset.pos; lsSet('pos', cfg.pos); applyCfg();
}));
document.querySelectorAll('[data-theme]').forEach(b => b.addEventListener('click', () => {
  cfg.theme = b.dataset.theme; lsSet('theme', cfg.theme); applyCfg();
}));
document.querySelectorAll('[data-width]').forEach(b => b.addEventListener('click', () => {
  cfg.width = b.dataset.width; lsSet('width', cfg.width); applyCfg();
}));

/* ── Mode switch ───────────────────────────────────────────────── */
function toggleMode() {
  cfg.mode = cfg.mode === 'titulky' ? 'diktovanie' : 'titulky';
  lsSet('mode', cfg.mode);
  applyCfg();
}
document.getElementById('btn-titulky').addEventListener('click',    () => { cfg.mode = 'titulky';    lsSet('mode', cfg.mode); applyCfg(); });
document.getElementById('btn-diktovanie').addEventListener('click', () => { cfg.mode = 'diktovanie'; lsSet('mode', cfg.mode); applyCfg(); });
document.addEventListener('keydown', e => {
  if (e.key.toLowerCase() === 'm' && !e.target.closest('#settings-panel')) toggleMode();
});

/* ── Caption / idle / scrim stav ───────────────────────────────── */
let captionHidden = false;
let hideTimer = null;
let connected = false;

function showCaption() {
  captionHidden = false;
  captionWrap.classList.remove('hidden');
  clearTimeout(hideTimer);
}
function hasText() {
  return cfg.mode === 'titulky'
    ? !!(l1.textContent.trim() || l2t.textContent.trim() || l2p.textContent.trim())
    : !!(committed.textContent.trim() || pending.textContent.trim());
}
function updateEmptyState() {
  const visible = !captionHidden && hasText();
  captionWrap.classList.toggle('hidden', !visible);
  scrimEl.classList.toggle('show', visible && cfg.pos === 'bottom');
  idleEl.classList.toggle('show', !visible);
  idleEl.classList.toggle('waiting', !connected || micPaused);
  document.getElementById('idle-title').textContent =
    !connected ? 'Čakám na server' : (micPaused ? 'Pozastavené' : 'Počúvam');
}
function scheduleHide() {
  hideTimer = setTimeout(() => {
    captionHidden = true;
    updateEmptyState();
  }, 5000);
}

/* ── Roll-up (TITULKY) ─────────────────────────────────────────── */
let seenWords = 0;
let committedBase = '';
const LINE_CHARS = { narrow: 18, medium: 26, wide: 36 };

const _measureCtx = document.createElement('canvas').getContext('2d');
function lineFits(text) {
  const glass = document.getElementById('caption-glass');
  const cs = getComputedStyle(l2t.parentElement);
  _measureCtx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
  let maxPx = parseFloat(getComputedStyle(glass).maxWidth);
  if (!Number.isFinite(maxPx)) {
    // computed maxWidth môže byť "min(28ch, 92vw)" → parseFloat NaN
    const chars = { narrow: 20, medium: 28, wide: 38 }[cfg.width] || 28;
    maxPx = Math.min(window.innerWidth * 0.92,
                     _measureCtx.measureText('n').width * chars);
  }
  return _measureCtx.measureText(text).width <= maxPx - 56;
}

/* ── Diarizácia: farba podľa rečníka (JBOP-100) ────────────────── */
const SPK_COLORS = ['', '#8fc2ff', '#ffc98f'];
const spkMap = {};
function applySpk(a, n, spk) {
  for (let i = a; i < a + n; i++) spkMap[i] = spk;
  document.querySelectorAll('[data-wi]').forEach(el => {
    const wi = +el.dataset.wi;
    if (wi >= a && wi < a + n) el.style.color = SPK_COLORS[spk] || '';
  });
}

function rollAddWord(w, wi) {
  const cur = l2t.textContent;
  const span = document.createElement('span');
  span.className = 'w';
  span.dataset.wi = wi;
  const col = SPK_COLORS[spkMap[wi]] || '';
  if (col) span.style.color = col;
  if (cur && !lineFits(cur + ' ' + w)) {
    l1.innerHTML = l2t.innerHTML;
    l2t.textContent = '';
    span.textContent = w;
  } else {
    span.textContent = (cur ? ' ' : '') + w;
  }
  l2t.appendChild(span);
}

function rollUpdate(text, base) {
  if (!text.startsWith(committedBase)) {
    seenWords = 0;
    l1.textContent = '';
    l2t.textContent = '';
    const ws2 = text.split(' ').filter(Boolean);
    const LINE_CH = LINE_CHARS[cfg.width] || LINE_CHARS.medium;
    let keep = 0, ln = 0;
    for (let i = ws2.length - 1; i >= 0; i--) {
      ln += ws2[i].length + 1;
      if (ln > LINE_CH * 1.5) break;
      keep = i;
    }
    seenWords = keep;
  }
  committedBase = text;
  const words = text.split(' ').filter(Boolean);
  for (; seenWords < words.length; seenWords++)
    rollAddWord(words[seenWords], (base || 0) + seenWords);
}

/* ── WS message handler ────────────────────────────────────────── */
let lastCommitted = '';

function onMessage(d) {
  if (d.event && d.event.t === 'paused') { applyPaused(d.event.on); return; }
  if (d.t === 'spk') { applySpk(d.a, d.n, d.spk); return; }
  if (!('committed' in d)) return;

  /* — DIKTOVANIE: sliding window ~84 chars — */
  const words = d.committed.split(' ');
  let shown = [], len = 0;
  for (let i = words.length - 1; i >= 0; i--) {
    len += words[i].length + 1;
    if (len > 84) break;
    shown.unshift(words[i]);
  }
  const txt = shown.join(' ');
  if (txt !== committed.textContent) {
    const old = committed.textContent;
    if (txt.startsWith(old) && old) {
      const span = document.createElement('span');
      span.className = 'w';
      span.textContent = txt.slice(old.length);
      committed.appendChild(span);
    } else {
      committed.textContent = txt;
    }
  }
  pending.textContent = d.pending ? '\u202F' + d.pending : '';
  cursor.style.display = (d.speaking && !d.pending) ? 'inline' : 'none';

  /* — TITULKY: roll-up — */
  rollUpdate(d.committed, d.base);
  l2p.textContent = d.pending ? (l2t.textContent ? ' ' : '') + d.pending : '';
  rcursor.style.display = (d.speaking && !d.pending) ? 'inline' : 'none';

  /* — Live eq — */
  eqEl.classList.toggle('live', !!d.speaking);

  /* — Auto-hide / idle — */
  if (d.committed !== lastCommitted || d.pending || d.speaking) {
    lastCommitted = d.committed;
    showCaption();
    scheduleHide();
  }
  updateEmptyState();

  /* — Telemetria (tichá, mono) — */
  const dl = d.draft_latency_s, fl = d.final_latency_s;
  const parts = [];
  if (dl != null) parts.push(`draft <b${dl > 1.5 ? ' class="warn"' : ''}>${dl.toFixed(1)}s</b>`);
  if (fl != null) parts.push(`final <b${fl > 4.5 ? ' class="warn"' : ''}>${fl.toFixed(1)}s</b>`);
  if (parts.length) statsEl.innerHTML = parts.join(' &nbsp;·&nbsp; ');
}

/* ── WebSocket ─────────────────────────────────────────────────── */
let wsRef = null;
let micPaused = false;
const micBtn = document.getElementById('mic-btn');
function applyPaused(on) {
  micPaused = on;
  micBtn.textContent = on ? '▶' : '⏸';
  micBtn.classList.toggle('paused', on);
  if (on) eqEl.classList.remove('live');
  updateEmptyState();
}
micBtn.addEventListener('click', () => {
  if (wsRef && wsRef.readyState === 1) wsRef.send(JSON.stringify({t: 'pause'}));
});
document.addEventListener('keydown', e => {
  if (e.key.toLowerCase() === 'k' && !e.metaKey && !e.ctrlKey) micBtn.click();
});
function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws`);
  wsRef = ws;
  ws.onopen = () => {
    connected = true;
    statsEl.innerHTML = '<b>pripojené</b>';
    updateEmptyState();
  };
  ws.onmessage = e => {
    try { onMessage(JSON.parse(e.data)); } catch(_) {}
  };
  ws.onclose = () => {
    connected = false;
    statsEl.innerHTML = '<span id="conn" class="off">odpojené — pripájam…</span>';
    eqEl.classList.remove('live');
    updateEmptyState();
    setTimeout(connect, 2000);
  };
}

/* ── Init ──────────────────────────────────────────────────────── */
applyCfg();
updateEmptyState();
connect();
</script>
