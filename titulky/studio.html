<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TITULKY.ŽIVO — Studio</title>
<style>
:root {
  --bg: #202227; --panel: #24262b; --panel-2: #2b2e34;
  --card: linear-gradient(180deg, #2b2e34 0%, #24262b 100%);
  --line: rgba(255,255,255,.065); --hi: rgba(255,255,255,.09);
  --ink: #f5f5f7; --ink-2: #a6adb8; --ink-3: #6b7280;
  --acc: #2f7cf6; --ok: #22a559; --warn: #e3a008; --err: #d92d3a;
  --radius: 24px;
  --shadow: 0 18px 44px rgba(0,0,0,.38), 0 2px 8px rgba(0,0,0,.25);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.45 -apple-system, "SF Pro Text", Inter, sans-serif;
  display: flex; flex-direction: column; overflow: hidden;
}

/* ── topbar ─────────────────────────────────────────────── */
#topbar {
  display: flex; align-items: center; gap: 14px;
  margin: 14px 14px 0; padding: 12px 18px;
  background: var(--card); border: 1px solid var(--line);
  border-radius: 20px; box-shadow: var(--shadow), inset 0 1px 0 var(--hi);
  flex: 0 0 auto;
}
#wordmark { font-weight: 800; letter-spacing: .14em; font-size: 13px;
  font-family: -apple-system, "SF Pro Display", Inter, sans-serif; }
#wordmark span { color: var(--acc); }
#status { display: flex; align-items: center; gap: 7px; font-size: 12.5px;
          color: var(--ink-2); }
#dot { width: 8px; height: 8px; border-radius: 50%; background: var(--err);
       transition: background .3s; }
#dot.on { background: var(--ok); }
#dot.sw { background: var(--warn); animation: blink 0.8s infinite; }
@keyframes blink { 50% { opacity: .3; } }
#topbar .spacer { flex: 1; }
.tbtn {
  background: linear-gradient(180deg, #33363d, #2a2d33); color: var(--ink);
  border: 1px solid var(--line); box-shadow: inset 0 1px 0 var(--hi);
  border-radius: 999px; padding: 7px 15px; font-size: 12.5px; cursor: pointer;
  transition: all .18s cubic-bezier(.22,.8,.24,1);
}
.tbtn:hover { border-color: var(--acc); }
.tbtn.active { background: linear-gradient(180deg, #58a0ff, var(--acc));
  border-color: transparent; color: #fff;
  box-shadow: 0 6px 16px rgba(47,124,246,.4); }

/* ── layout ─────────────────────────────────────────────── */
#main { flex: 1; display: flex; min-height: 0; }
#stage { flex: 1; display: flex; flex-direction: column; min-width: 0;
         padding: 16px; gap: 14px; }
#side  { flex: 0 0 348px; overflow-y: auto; padding: 16px 16px 16px 2px;
         display: flex; flex-direction: column; gap: 14px; }

/* ── video ──────────────────────────────────────────────── */
#videoBox {
  position: relative; flex: 1; min-height: 0; border-radius: var(--radius);
  background: #0c0d10; overflow: hidden; border: 1px solid var(--line);
  box-shadow: var(--shadow); display: flex; align-items: center;
  justify-content: center;
}
#cam { width: 100%; height: 100%; object-fit: cover; display: none;
       transform: scaleX(-1); }
#camOff { color: var(--ink-3); font-size: 14px; text-align: center; }
#camOff .big { font-size: 42px; display: block; margin-bottom: 8px; }
#subStrip {
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: 18px 26px 20px;
  background: linear-gradient(transparent, rgba(0,0,0,.82) 40%);
  font-size: clamp(18px, 2.6vw, 30px); font-weight: 650; line-height: 1.32;
  text-align: center; text-shadow: 0 1px 6px rgba(0,0,0,.9);
  max-height: 38%; overflow: hidden; display: flex; flex-direction: column;
  justify-content: flex-end;
}
#subCommitted { color: #fff; }
#subPending   { color: #ffffff80; }

/* ── transcript ─────────────────────────────────────────── */
#transcript {
  flex: 0 0 120px; background: var(--card); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 12px 18px; overflow-y: auto;
  font-size: 14px; color: var(--ink-2);
  box-shadow: var(--shadow), inset 0 1px 0 var(--hi);
}
#transcript b { color: var(--ink); font-weight: 500; }

/* ── side panely ───────────────────────────────────────── */
.card { background: var(--card); border: 1px solid var(--line);
        border-radius: var(--radius); padding: 16px 18px;
        box-shadow: var(--shadow), inset 0 1px 0 var(--hi); }
.card h3 { font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
           color: var(--ink-3); margin-bottom: 11px; font-weight: 700; }
.engine-opt {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px;
  border-radius: 9px; cursor: pointer; font-size: 13.5px;
  border: 1px solid transparent; transition: background .15s;
}
.engine-opt:hover { background: #ffffff0a; }
.engine-opt.sel { border-color: rgba(47,124,246,.55);
  background: rgba(47,124,246,.12);
  box-shadow: 0 4px 14px rgba(47,124,246,.18); }
.engine-opt .r { width: 14px; height: 14px; border-radius: 50%;
  border: 2px solid var(--ink-3); flex: 0 0 auto; }
.engine-opt.sel .r { border-color: var(--acc); background: var(--acc);
  box-shadow: inset 0 0 0 3px var(--panel-2); }
.engine-opt small { display: block; color: var(--ink-3); font-size: 11.5px; }
#engineNote { font-size: 11.5px; color: var(--warn); margin-top: 8px;
              display: none; }

.statgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { background: #1d1f24; border-radius: 14px; padding: 10px 12px;
  box-shadow: inset 0 1px 3px rgba(0,0,0,.3); }
.stat .v { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat .l { font-size: 10.5px; color: var(--ink-3); letter-spacing: .05em;
           text-transform: uppercase; margin-top: 1px; }
canvas.spark { width: 100%; height: 44px; margin-top: 10px; }
.sparklabel { font-size: 10.5px; color: var(--ink-3); margin-top: 8px;
              display: flex; justify-content: space-between; }

select, .row-btns button {
  width: 100%; background: #1d1f24; color: var(--ink);
  border: 1px solid var(--line); border-radius: 12px; padding: 9px 11px;
  font-size: 13px; cursor: pointer;
}
.row-btns { display: flex; gap: 8px; }
.row-btns button:hover { border-color: var(--acc); }
#meter { height: 6px; border-radius: 3px; background: #1d1f24;
         overflow: hidden; margin-top: 10px; }
#meterFill { height: 100%; width: 0%; background: var(--ok);
             transition: width .12s linear; }
</style>
</head>
<body>

<div id="topbar">
  <span id="wordmark">TITULKY<span>&hairsp;.ŽIVO</span></span>
  <span id="status"><span id="dot"></span><span id="statusTxt">pripájam…</span></span>
  <span class="spacer"></span>
  <button class="tbtn" id="btnCam">📷 Kamera</button>
  <button class="tbtn" id="btnPause">⏸ Pauza</button>
  <button class="tbtn" onclick="location.href='/'">Overlay</button>
  <button class="tbtn" onclick="location.href='/flow'">Flow</button>
  <button class="tbtn" onclick="location.href='/lab'">Lab</button>
  <button class="tbtn" onclick="location.href='/settings'">⚙</button>
</div>

<div id="main">
  <div id="stage">
    <div id="videoBox">
      <video id="cam" autoplay playsinline muted></video>
      <div id="camOff"><span class="big">📷</span>Kamera vypnutá<br>
        <small style="color:var(--ink-3)">zapni ju tlačidlom hore</small></div>
      <div id="subStrip"><span id="subCommitted"></span>
        <span id="subPending"></span></div>
    </div>
    <div id="transcript"><b>Prepis</b> — zatiaľ prázdny…</div>
  </div>

  <div id="side">
    <div class="card">
      <h3>Engine / Model</h3>
      <div id="engineList"></div>
      <div id="engineNote">Prepínam… lokálny model sa načítava ~15 s.</div>
    </div>

    <div class="card">
      <h3>Štatistiky</h3>
      <div class="statgrid">
        <div class="stat"><div class="v" id="stTime">0:00</div>
          <div class="l">session</div></div>
        <div class="stat"><div class="v" id="stWords">0</div>
          <div class="l">slov</div></div>
        <div class="stat"><div class="v" id="stWpm">—</div>
          <div class="l">slov/min</div></div>
        <div class="stat"><div class="v" id="stCost">—</div>
          <div class="l">cena (cloud)</div></div>
        <div class="stat"><div class="v" id="stDraft">—</div>
          <div class="l">šedé p50</div></div>
        <div class="stat"><div class="v" id="stFinal">—</div>
          <div class="l">biele p50</div></div>
      </div>
      <canvas id="spark" class="spark"></canvas>
      <div class="sparklabel"><span>latencia bieleho (posledných 60)</span>
        <span id="sparkMax"></span></div>
      <div id="meter"><div id="meterFill"></div></div>
    </div>

    <div class="card">
      <h3>Kamera</h3>
      <select id="camSel"><option>— povoľ kameru —</option></select>
    </div>

    <div class="card">
      <h3>Export</h3>
      <div class="row-btns">
        <button id="expTxt">⬇ TXT</button>
        <button id="expSrt">⬇ SRT</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ── stav ──────────────────────────────────────────────── */
const $ = id => document.getElementById(id);
let ws, wsOk = false, paused = false;
let engineState = {engine: null, model: null, switching: false, catalog: []};
let t0 = Date.now(), cloudSec = 0, lastTick = Date.now();
let finLat = [];           // posledné latencie bieleho pre sparkline
let srt = [];              // [{t0,t1,text}] klientske SRT segmenty
let lastCommitted = "", lastCommitT = null;
const CLOUD_RATE = {"gpt-live-transcribe": 0.017,
                    "gpt-4o-transcribe": 0.006,
                    "gpt-4o-mini-transcribe": 0.003};

/* ── websocket ─────────────────────────────────────────── */
function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => { wsOk = true; setDot(); ws.send('{"t":"state"}'); };
  ws.onclose = () => { wsOk = false; setDot(); setTimeout(connect, 1500); };
  ws.onmessage = m => { try { handle(JSON.parse(m.data)); } catch(e){} };
}
function setDot() {
  const d = $("dot");
  d.className = engineState.switching ? "sw" : (wsOk ? "on" : "");
  $("statusTxt").textContent = engineState.switching ? "prepínam model…"
    : !wsOk ? "odpojené"
    : engineState.engine === "cloud" ? `cloud · ${engineState.model}`
    : engineState.engine === "local" ? "lokál · kinit-turbo-sk" : "pripojené";
}

function handle(d) {
  if (d.event) { handleEvent(d.event); return; }
  if (d.committed === undefined) return;
  /* titulkový pás */
  const words = d.committed.split(" ").filter(Boolean);
  $("subCommitted").textContent = words.slice(-14).join(" ");
  $("subPending").textContent = " " + (d.pending || "");
  /* prepis */
  if (d.committed && d.committed !== lastCommitted) {
    const now = (Date.now() - t0) / 1000;
    const newPart = d.committed.startsWith(lastCommitted)
      ? d.committed.slice(lastCommitted.length).trim() : d.committed;
    if (newPart) srt.push({t0: lastCommitT ?? Math.max(0, now - 3),
                           t1: now, text: newPart});
    lastCommitT = now; lastCommitted = d.committed;
    $("transcript").innerHTML = "<b>Prepis</b> — " + esc(d.committed);
    $("transcript").scrollTop = $("transcript").scrollHeight;
  }
  /* štatistiky */
  $("stWords").textContent = words.length;
  const min = (Date.now() - t0) / 60000;
  $("stWpm").textContent = min > 0.2 ? Math.round(words.length / min) : "—";
  if (d.avg_draft_latency_s != null)
    $("stDraft").textContent = d.avg_draft_latency_s.toFixed(2) + "s";
  if (d.avg_final_latency_s != null)
    $("stFinal").textContent = d.avg_final_latency_s.toFixed(2) + "s";
  if (d.final_latency_s != null) {
    finLat.push(d.final_latency_s); if (finLat.length > 60) finLat.shift();
    drawSpark();
  }
  $("meterFill").style.width = d.speaking ? "92%" : "6%";
  $("meterFill").style.background = d.speaking ? "var(--ok)" : "var(--ink-3)";
}

function handleEvent(e) {
  if (e.t === "engine_state") {
    engineState = e; renderEngines(); setDot();
    $("engineNote").style.display = e.switching ? "block" : "none";
  } else if (e.t === "paused") {
    paused = e.on;
    $("btnPause").textContent = paused ? "▶ Pokračuj" : "⏸ Pauza";
    $("btnPause").classList.toggle("active", paused);
  } else if (e.t === "transcript") {
    downloadFile("prepis.txt", e.text);
  } else if (e.t === "cloud_err") {
    $("statusTxt").textContent = "chyba: " + e.msg;
  }
}

/* ── engine prepínač ───────────────────────────────────── */
function renderEngines() {
  const box = $("engineList"); box.innerHTML = "";
  for (const c of engineState.catalog) {
    const sel = engineState.engine === c.engine &&
                (engineState.model || null) === (c.model || null);
    const div = document.createElement("div");
    div.className = "engine-opt" + (sel ? " sel" : "");
    const price = c.model ? (CLOUD_RATE[c.model] ?
      `$${(CLOUD_RATE[c.model]*60).toFixed(2)}/h` : "") : "offline · 0 €";
    div.innerHTML = `<span class="r"></span>
      <span>${c.label}<small>${price}</small></span>`;
    div.onclick = () => {
      if (engineState.switching || sel) return;
      ws.send(JSON.stringify({t: "engine", engine: c.engine, model: c.model}));
    };
    box.appendChild(div);
  }
}

/* ── kamera ────────────────────────────────────────────── */
let camStream = null;
async function camOn(deviceId) {
  camOffStop();
  try {
    camStream = await navigator.mediaDevices.getUserMedia({
      video: deviceId ? {deviceId: {exact: deviceId}} : true, audio: false});
    $("cam").srcObject = camStream;
    $("cam").style.display = "block"; $("camOff").style.display = "none";
    $("btnCam").classList.add("active");
    const devs = (await navigator.mediaDevices.enumerateDevices())
      .filter(x => x.kind === "videoinput");
    const sel = $("camSel"); sel.innerHTML = "";
    devs.forEach(x => {
      const o = document.createElement("option");
      o.value = x.deviceId; o.textContent = x.label || "kamera";
      sel.appendChild(o);
    });
    if (deviceId) sel.value = deviceId;
  } catch (e) { $("statusTxt").textContent = "kamera: " + e.name; }
}
function camOffStop() {
  if (camStream) camStream.getTracks().forEach(tr => tr.stop());
  camStream = null;
  $("cam").style.display = "none"; $("camOff").style.display = "block";
  $("btnCam").classList.remove("active");
}
$("btnCam").onclick = () => camStream ? camOffStop() : camOn();
$("camSel").onchange = ev => camStream && camOn(ev.target.value);

/* ── ovládanie ─────────────────────────────────────────── */
$("btnPause").onclick = () => ws.send('{"t":"pause"}');
$("expTxt").onclick = () => ws.send('{"t":"transcript"}');
$("expSrt").onclick = () => {
  let out = "", i = 1;
  for (const s of srt) {
    out += `${i++}\n${ts(s.t0)} --> ${ts(s.t1)}\n${s.text}\n\n`;
  }
  downloadFile("titulky.srt", out || "1\n00:00:00,000 --> 00:00:01,000\n—\n");
};
function ts(sec) {
  const h = String(Math.floor(sec/3600)).padStart(2,"0"),
        m = String(Math.floor(sec%3600/60)).padStart(2,"0"),
        s = String(Math.floor(sec%60)).padStart(2,"0"),
        ms = String(Math.round(sec%1*1000)).padStart(3,"0");
  return `${h}:${m}:${s},${ms}`;
}
function downloadFile(name, text) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], {type: "text/plain"}));
  a.download = name; a.click();
}
function esc(s){const d=document.createElement("div");d.textContent=s;
  return d.innerHTML;}

/* ── sparkline ─────────────────────────────────────────── */
function drawSpark() {
  const c = $("spark"), ctx = c.getContext("2d");
  c.width = c.offsetWidth * 2; c.height = 88;
  ctx.clearRect(0, 0, c.width, c.height);
  if (!finLat.length) return;
  const max = Math.max(...finLat, 1);
  $("sparkMax").textContent = "max " + max.toFixed(1) + "s";
  const w = c.width / Math.max(finLat.length, 10);
  ctx.fillStyle = "#2f7cf6aa";
  finLat.forEach((v, i) => {
    const h = Math.max(3, v / max * (c.height - 6));
    ctx.fillRect(i * w, c.height - h, Math.max(2, w - 2), h);
  });
}

/* ── hodiny + cena ─────────────────────────────────────── */
setInterval(() => {
  const s = Math.floor((Date.now() - t0) / 1000);
  $("stTime").textContent = `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
  if (engineState.engine === "cloud" && !paused)
    cloudSec += (Date.now() - lastTick) / 1000;
  lastTick = Date.now();
  const rate = CLOUD_RATE[engineState.model];
  $("stCost").textContent = engineState.engine === "cloud" && rate
    ? "$" + (cloudSec / 60 * rate).toFixed(3) : "0 €";
}, 1000);

connect();
</script>
</body>
</html>
